name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor loyihasini yaratish
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets sharp
          npx cap init "Namoz vaqtlari" uz.namozvaqtlari.app --web-dir=www
          npx cap add android

      - name: Ikonkalarni yaratish
        run: |
          cat > mk.js <<'EOF'
          const sharp = require('sharp'), fs = require('fs');
          const svg = fs.readFileSync('icon.svg', 'utf8');
          const fg = svg.replace(/<g id="bg">[\s\S]*?<\/g>/, '');
          (async () => {
            await sharp(Buffer.from(svg), { density: 300 }).resize(1024, 1024).png().toFile('assets/icon-only.png');
            await sharp(Buffer.from(fg), { density: 300 }).resize(1024, 1024).png().toFile('assets/icon-foreground.png');
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#14195a' } }).png().toFile('assets/icon-background.png');
          })();
          EOF
          node mk.js
          npx capacitor-assets generate --android

      - name: Ruxsatlar (joylashuv)
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: APK yig'ish
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Namoz-vaqtlari-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
